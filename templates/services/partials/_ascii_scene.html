{% load static %}
<div class="ascii-scene-wrapper ascii-scene--service-hero"
     data-ascii-scene="{{ ascii_scene }}"
     data-ascii-options='{{ ascii_options|safe }}'
     data-ascii-fps="24"
     data-ascii-width="80"
     data-ascii-height="40"
     data-ascii-palette="cream"
     data-ascii-state="idle"
     aria-hidden="true">
  <canvas class="ascii-canvas" loading="lazy" aria-hidden="true"></canvas>
  <noscript>
    <div class="ascii-fallback" style="
      display: flex; align-items: center; justify-content: center;
      width: 100%; height: 100%; min-height: 180px;
      background: var(--color-void);
      color: var(--color-sand);
      font-family: monospace; font-size: clamp(10px, 1.5vw, 14px);
      border: 1px solid rgba(216, 207, 192, 0.1);
      border-radius: 0.5rem;
    ">
      [ASCII {{ ascii_scene|title }} scene — requires JavaScript]
    </div>
  </noscript>
</div>
<script type="module">
  import('{% static "js/ascii/engine.js" %}').then(() => {
    import('{% static "js/ascii/scenes/"|add:ascii_scene|add:".js" %}').then(() => {
      if (window.initAsciiFromDOM) {
        const wrapper = document.currentScript?.closest('[data-ascii-scene]');
        if (wrapper && !wrapper._asciiEngine) {
          window.initAsciiFromDOM(wrapper);
        }
      }
    }).catch(err => {
      console.warn('ASCII {{ ascii_scene }} scene failed to load:', err);
    });
  }).catch(err => {
    console.warn('ASCII Engine failed to load:', err);
  });
</script>
