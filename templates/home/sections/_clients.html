{# برندهای همکار — مارکی بی‌نهایت که با هاور متوقف می‌شود #}
{# داده‌ها: clients (ClientMarqueeItem) #}
{% if clients %}
  <section class="overflow-hidden whitespace-nowrap border-y border-line bg-paper-soft/40 py-[30px] backdrop-blur-sm"
           aria-label="مشتریان منتخب"
           data-reveal="fade-in"
           data-bg-intensity="0.6" data-bg-glow="0.5" data-bg-hue="0.08">
    <div class="inline-flex animate-marq-slow gap-20 font-display text-[clamp(1.5rem,2.2vw,2.4rem)] font-medium text-ink-dim hover:[animation-play-state:paused]">
      {% for client in clients %}
        <span class="inline-flex items-center gap-20">{{ client.name }} <span class="text-line-strong">·</span></span>
      {% endfor %}
      {% for client in clients %}
        <span class="inline-flex items-center gap-20">{{ client.name }} <span class="text-line-strong">·</span></span>
      {% endfor %}
    </div>
  </section>
{% endif %}
