{% comment %}sidebar: table of contents{% endcomment %}
{% if toc %}
  <div class="rounded-[6px] border border-line p-6" data-aos="fade-up" data-aos-delay="100" data-aos-duration="700">
    <div class="mb-4 border-b border-line pb-3 font-mono text-[0.72rem] uppercase tracking-[0.14em] text-ink-dim">فهرست مطالب</div>
    <ul class="m-0 flex list-none flex-col gap-0.5 p-0" id="toc">
      {% for item in toc %}
        <li>
          <a href="#{{ item.id }}" class="block rounded-sm px-2.5 py-[7px] font-mono text-[0.78rem] leading-[1.45] tracking-[0.04em] text-ink-dim transition-[background,color] duration-150 before:mr-2 before:inline-block before:h-[5px] before:w-[5px] before:rounded-full before:bg-line before:align-[3px] hover:bg-paper-soft hover:text-ink [&.active]:text-ink [&.active]:before:bg-lime">{{ item.number }}. {{ item.text }}</a>
        </li>
      {% endfor %}
    </ul>
  </div>
{% endif %}
