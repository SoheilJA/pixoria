{% load static icon_tags %}
<!DOCTYPE html>
<html lang="fa" dir="rtl">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="theme-color" content="#0a0a0c" />
    {% comment %}پیش‌لودر: فقط یک بار در هر session — پرچم قبل از رنگ‌پاشی اولین فریم
    ست می‌شود تا هیچ فلشی دیده نشود. بدون جاوااسکریپت کلاس اضافه نمی‌شود
    و پیش‌لودر هرگز نمایش داده نمی‌شود (همان <noscript>).{% endcomment %}
    <script>
      (function () {
        try {
          if (sessionStorage.getItem("pixoria-pl")) return;
          sessionStorage.setItem("pixoria-pl", "1");
          document.documentElement.classList.add("has-preloader");
        } catch (e) {}
      })();
    </script>
    {% comment %}
    پرچمِ حرکت: کلاسِ motion حالتِ پنهانِ اولیهٔ انیمیشن‌ها را فعال می‌کند.
    اگر ماژولِ pixoria.js تا ۳ ثانیه بالا نیاید (خطای JS، شبکه، مرورگر
    قدیمی) کلاس برداشته می‌شود تا محتوا هرگز پنهان نماند.
    {% endcomment %}
    <script>
      (function () {
        document.documentElement.classList.add("motion");
        setTimeout(function () {
          if (!window.__pixoriaBooted) {
            document.documentElement.classList.remove("motion");
          }
        }, 3000);
      })();
    </script>
    <title>
      {% block title %}
        {{ settings.site_name }}
      {% endblock %}
    </title>
    <meta name="description"
      content="{% block description %}
      {% endblock %}" />
    <link rel="canonical" href="{{ request.build_absolute_uri }}" />

    {% comment %} Open Graph — برای سئو و اشتراک‌گذاری در شبکه‌های اجتماعی {% endcomment %}
    <meta property="og:site_name" content="{{ settings.site_name }}" />
    <meta property="og:locale" content="fa_IR" />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="{{ request.build_absolute_uri }}" />
    <meta property="og:title" content="{% block og_title %}{{ settings.site_name }}{% endblock %}" />
    <meta property="og:description" content="{% block og_description %}{{ settings.site_description }}{% endblock %}" />
    <meta name="twitter:card" content="summary_large_image" />
    {% if brand.og_image %}
      <meta property="og:image" content="{{ brand.og_image }}" />
      <meta property="og:image:alt" content="{{ settings.site_name }}" />
    {% endif %}
    {% comment %}فاوآیکون — فایل آپلودشده در SiteSettings اولویت دارد، وگرنه
    گزینهٔ منتخبِ برند (T58). مانیفست از یک view رندر می‌شود تا آیکون‌های PWA
    هم از همان گزینه بخوانند.{% endcomment %}
    {% if settings.favicon %}
      <link rel="icon" href="{{ settings.favicon.url }}" sizes="any" />
    {% else %}
      {% if brand.favicon_svg %}<link rel="icon" type="image/svg+xml" href="{{ brand.favicon_svg }}" />{% endif %}
      {% if brand.favicon_32 %}<link rel="icon" type="image/png" sizes="32x32" href="{{ brand.favicon_32 }}" />{% endif %}
    {% endif %}
    {% if settings.apple_touch_icon %}
      <link rel="apple-touch-icon" href="{{ settings.apple_touch_icon.url }}" />
    {% elif brand.apple_touch %}
      <link rel="apple-touch-icon" href="{{ brand.apple_touch }}" />
    {% endif %}
    <link rel="manifest" href="{% url 'manifest' %}" />
    <link rel="stylesheet" href="{% static 'fonts/font_urls.css' %}" />
    <link rel="stylesheet" href="{% static 'css/tailwind.css' %}" />
    {% comment %} لایهٔ حرکت — همهٔ انیمیشن‌ها به‌صورت CSS (بدون GSAP) {% endcomment %}
    <link rel="stylesheet" href="{% static 'css/motion.css' %}" />
    {% comment %} بازطراحی Ryoku — لودِ آخرین برای غلبه بر استایل‌های قدیمی {% endcomment %}
    <link rel="stylesheet" href="{% static 'css/ry.css' %}" />
    {% comment %} ASCII Canvas Styles {% endcomment %}
    <link rel="stylesheet" href="{% static 'css/ascii.css' %}" />
    {% block extra_css %}
    {% endblock %}
    {% block extra_head %}
    {% endblock %}
  </head>
<body class="overflow-x-hidden bg-ink font-sans text-cream antialiased">
    <!-- RYOKU PRELOADER MARKER -->
    <div id="preloader" class="preloader" role="presentation" aria-hidden="true">
      <div class="pl-bg">
        <div class="pl-scanlines"></div>
        <div class="pl-noise"></div>
        <div class="pl-matrix" id="pl-matrix"></div>
      </div>
      <div class="pl-content">
        <div class="pl-header">
          <div class="pl-brand">
            <span class="pl-brand-mark" aria-hidden="true">{% include "partials/_brand_mark.html" with class="h-8 w-8" %}</span>
            <span class="pl-brand-word">PIXORIA</span>
          </div>
          <div class="pl-tagline">DESIGN & DEVELOPMENT STUDIO</div>
        </div>
        <div class="pl-boot" id="pl-boot">
          <div class="pl-boot-line"><span class="pl-prompt">></span> <span class="pl-boot-text" data-text="INITIALIZING SYSTEM..."></span></div>
          <div class="pl-boot-line"><span class="pl-prompt">></span> <span class="pl-boot-text" data-text="LOADING DESIGN TOKENS..."></span></div>
          <div class="pl-boot-line"><span class="pl-prompt">></span> <span class="pl-boot-text" data-text="LOADING FONTS..."></span></div>
          <div class="pl-boot-line"><span class="pl-prompt">></span> <span class="pl-boot-text" data-text="LOADING ASSETS..."></span></div>
          <div class="pl-boot-line"><span class="pl-prompt">></span> <span class="pl-boot-text" data-text="INITIALIZING RENDER ENGINE..."></span></div>
          <div class="pl-boot-line"><span class="pl-prompt">></span> <span class="pl-boot-text" data-text="SYSTEM READY."></span></div>
        </div>
        <div class="pl-progress-wrap">
          <div class="pl-progress-bar" id="pl-progress"></div>
          <div class="pl-progress-pct" id="pl-pct">0%</div>
        </div>
        <div class="pl-footer">
          <div class="pl-scanline"></div>
          <div class="pl-copyright">PIXORIA STUDIO — EST. 1405</div>
        </div>
      </div>
      <div class="pl-glitch" aria-hidden="true"></div>
    </div>

    {% comment %} پرش به محتوای اصلی — دسترس‌پذیری {% endcomment %}
    <a
      href="#main"
      class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:right-2 focus:z-[200] focus:rounded-full focus:bg-gold focus:px-5 focus:py-2 focus:text-ink"
      >پرش به محتوای اصلی</a
    >

    {% comment %} نوار پیشرفت اسکرول {% endcomment %}
    <div
      id="scroll-progress"
      class="fixed top-0 right-0 left-0 z-[85] h-px origin-right scale-x-0"
      style="background: var(--color-sand);"
      aria-hidden="true"
    ></div>

    {% comment %}لودر انتقال بین صفحات — نوار طلایی نازک بالا + سیارهٔ مداری در گوشه
    (فقط اگر ناوبری بیش از ~۴۰۰ms طول بکشد). هرگز صفحه را نمی‌پوشاند و
    کلیک‌ها را مسدود نمی‌کند — pixoria.js آن را راه می‌اندازد (T54){% endcomment %}
    <div id="nav-progress" class="nav-progress" aria-hidden="true">
      <div class="nav-progress-bar"></div>
    </div>
    <div id="nav-orbit" class="nav-orbit" aria-hidden="true">
      <span class="nav-orbit-ring"></span><span class="nav-orbit-planet"></span>
    </div>

    {% comment %} بافت نویز ظریف {% endcomment %}
    <div class="grain" aria-hidden="true"></div>

    {% include "partials/_header.html" %}

    <main id="main" class="min-w-0">
      {% block content %}
      {% endblock %}
{% include "partials/_cta.html" %}
    {% include "partials/_ascii_band.html" %}
    {% block afterPrefooter %}
    {% endblock %}
    </main>

    {% include "partials/_footer.html" %}

    {% comment %} اعلان (Toast) — توسط pixoria.js نمایش داده می‌شود {% endcomment %}
    <div
      id="toast"
      class="fixed inset-x-0 bottom-6 z-[100] flex justify-center px-4"
      role="status"
      aria-live="polite"
    >
      <div class="glass flex items-center gap-3 rounded-full px-6 py-4">
        <span
          class="grid h-7 w-7 flex-none place-items-center rounded-full bg-gold/20 text-gold-light"
          >{% icon "check" class="h-4 w-4" %}</span
        >
        <p id="toast-text" class="text-sm text-cream/85"></p>
      </div>
    </div>

    {% comment %} کتابخانه‌ها — همه محلی، بدون CDN. هیچ GSAP/ScrollTrigger ای در پروژه
       نیست: تمام انیمیشن‌ها در static/css/motion.css و با CSS اجرا می‌شوند. {% endcomment %}
    {% comment %} لایهٔ تعاملات (ماشه‌ها، شمارنده‌ها، منو، …) — T10 {% endcomment %}
    <script type="module" src="{% static 'js/pixoria.js' %}"></script>
    {% comment %} ریویلِ زبان طراحی Ryoku — فقط عناصرِ .ry-reveal را فعال می‌کند {% endcomment %}
    <script defer src="{% static 'js/ry-reveal.js' %}"></script>
    {% comment %} تعاملاتِ سبکِ Ryoku (فیلم‌استریپ و ...) {% endcomment %}
    <script defer src="{% static 'js/ry.js' %}"></script>
    {% comment %} صحنهٔ سه‌بعدی هیرو — فقط در صورت وجود #hero-3d و نزدیک بودن به دید مقداردهی می‌شود — T11 {% endcomment %}
    <script defer src="{% static 'js/hero-field.js' %}"></script>
    {% comment %} HTMX — برای فرم‌های ارسال بدون بازبارگذاری صفحه {% endcomment %}
    <script defer src="{% static 'js/htmx.min.js' %}"></script>
    {% comment %} Custom Select — vanilla JS (no Alpine dependency) {% endcomment %}
    <script>
      // Custom Select Component - Vanilla JS
      class CustomSelect {
        constructor(wrapper) {
          this.wrapper = wrapper;
          // Django renders the select directly, find it
          this.native = wrapper.querySelector('select[id^="id_"]');
          this.trigger = wrapper.querySelector('.field__select-trigger');
          this.dropdown = wrapper.querySelector('.field__dropdown');
          this.textEl = wrapper.querySelector('.field__select-text');
          this.options = [];
          this.open = false;

          if (!this.native || !this.trigger || !this.dropdown) {
            console.warn('CustomSelect: missing elements', { 
              wrapper, 
              native: this.native, 
              trigger: !!this.trigger, 
              dropdown: !!this.dropdown 
            });
            return;
          }

          this.init();
          this.wrapper._customSelect = this;
        }

        init() {
          // Read options from native select
          this.options = Array.from(this.native.options).map(opt => ({
            value: opt.value,
            text: opt.text
          }));
          this.selectedText = this.native.options[this.native.selectedIndex]?.text || '';

          // Build dropdown options
          this.renderDropdown();

          // Event listeners
          this.trigger.addEventListener('click', () => this.toggle());
          this.trigger.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') this.close();
          });
          this.dropdown.addEventListener('click', (e) => {
            const option = e.target.closest('.field__option');
            if (option) this.select(option.dataset.value, option.textContent.trim());
          });

          // Sync native select changes
          this.native.addEventListener('change', () => {
            this.selectedText = this.native.options[this.native.selectedIndex]?.text || '';
            this.updateTrigger();
          });

          // Close on outside click
          document.addEventListener('click', (e) => {
            if (!this.wrapper.contains(e.target)) this.close();
          });

          this.updateTrigger();
          console.log('CustomSelect initialized', this.wrapper);
        }

        renderDropdown() {
          this.dropdown.innerHTML = this.options.map(opt => `
            <div class="field__option" role="option" data-value="${opt.value}">
              ${opt.text}
            </div>
          `).join('');
        }

        updateTrigger() {
          this.textEl.textContent = this.selectedText || 'موضوع را انتخاب کنید';
          this.textEl.style.color = this.selectedText ? 'var(--color-sand)' : 'rgba(216, 207, 192, 0.5)';
        }

        toggle() {
          this.open ? this.close() : this.openDropdown();
        }

        openDropdown() {
          this.open = true;
          this.dropdown.hidden = false;
          this.trigger.setAttribute('aria-expanded', 'true');
        }

        close() {
          this.open = false;
          this.dropdown.hidden = true;
          this.trigger.setAttribute('aria-expanded', 'false');
        }

        select(value, text) {
          this.native.value = value;
          this.native.dispatchEvent(new Event('change', { bubbles: true }));
          this.selectedText = text;
          this.updateTrigger();
          this.close();
        }
      }

      // Auto-initialize all custom selects
      function initCustomSelects() {
        console.log('Initializing custom selects...');
        document.querySelectorAll('.field__select-wrap').forEach(wrapper => {
          if (!wrapper._customSelect) {
            new CustomSelect(wrapper);
          }
        });
      }

      // Run on DOMContentLoaded
      if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initCustomSelects);
      } else {
        initCustomSelects();
      }
    </script>
    {% block extra_js %}
    {% endblock %}
  </body>
</html>
